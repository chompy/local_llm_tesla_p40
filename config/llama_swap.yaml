globalTTL: 3600

macros:

  default_llama_bin: >
    lib/llama_cpp/build/bin/llama-server --port ${PORT}

  # Tuned for a Tesla P40 (sm_61, DP4A, no tensor cores) with 24GB VRAM.
  # Q4_K_M weights (~17GB) + q4_0 KV cache at 131K ctx fit in the card: Qwen3.8 is a
  # hybrid SSM/full-attention model (only ~1/4 of layers hold KV), so the cache stays
  # around ~2.5GB even at 131072 tokens. Verified live: server idles at ~21GiB used.
  # MTP speculative decoding (--spec-type draft-mtp) works because the GGUF ships its
  # own nextn layer — no separate draft model needed, and it saves full forward passes.
  default_args: |
    --ctx-size 131072
    -ngl 999
    --flash-attn on
    -b 2048
    -ub 2048
    --cache-type-k q4_0
    --cache-type-v q4_0
    -np 1
    --host 0.0.0.0
    --temp 0.7
    --top-p 0.9
    --top-k 40
    --min-p 0.05
    --repeat-penalty 1.1
    --prio 2
    --jinja
    --chat-template-file config/chat_template.jinja
    --spec-type draft-mtp
    --spec-draft-n-max 2
    -ngld 99
    --kv-unified
    --reasoning-preserve
    --cache-idle-slots

models:
  "unsloth-qwen38-27B-Q4KM":
    cmd: |
      ${default_llama_bin}
      -hf "unsloth/Qwen3.8-27B-GGUF:Q4_K_M"
      ${default_args}
